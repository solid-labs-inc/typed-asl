name: CI

on:
  push:
    branches: [main]
  pull_request:

# Default-deny at the workflow level; jobs opt into anything more.
# Actions are pinned to commit SHAs (dependabot's github-actions ecosystem
# bumps them and rewrites the trailing version comment).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      # Coverage thresholds are enforced on a single pinned leg — v8
      # coverage attribution can shift between Node versions, and the
      # ratchet margin is deliberately thin.
      - run: npm test
        if: matrix.node != 22
      - run: npm run test:coverage
        if: matrix.node == 22
      # Reporting only. The ratchet in vitest.config.ts is what gates a
      # merge, so a Codecov outage can never turn a red build green — and
      # never fails the build on its own (fail_ci_if_error: false).
      - name: Upload coverage to Codecov
        if: matrix.node == 22
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
      - run: npm run build

  # The library's behavior is substantially type-level, so a compiler
  # upgrade can be a breaking change. Typecheck (including the negative
  # @ts-expect-error tests) against the newest 5.x and the 7.x line; the
  # pinned ~5.7.2 is already covered by the build job's `npm run
  # typecheck`. Lint intentionally stays on the pinned version only —
  # typescript-eslint support lags major compiler releases.
  typecheck-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typescript: ['^5', 'latest']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save typescript@${{ matrix.typescript }}
      - run: npx tsc --version
      - run: npx tsc --noEmit
