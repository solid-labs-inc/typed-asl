name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

  # The library's behavior is substantially type-level, so a compiler
  # upgrade can be a breaking change. Typecheck (including the negative
  # @ts-expect-error tests) against the pinned compiler, the newest 5.x,
  # and the 7.x line. Lint intentionally stays on the pinned version
  # only — typescript-eslint support lags major compiler releases.
  typecheck-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typescript: ['~5.7.2', '^5', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save typescript@${{ matrix.typescript }}
      - run: npx tsc --version
      - run: npx tsc --noEmit
