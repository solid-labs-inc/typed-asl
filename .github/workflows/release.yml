name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # Mints the OIDC token npm exchanges for short-lived publish credentials.
  # Without it the publish step fails with no trusted publisher match.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs a newer npm than any Node release bundles.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # No NODE_AUTH_TOKEN: credentials come from the OIDC exchange, and
      # provenance is attached automatically.
      - run: npm publish
