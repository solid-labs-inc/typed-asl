name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # Mints the OIDC token npm exchanges for short-lived publish credentials.
  # Without it the publish step fails with no trusted publisher match.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs a newer npm than any Node release bundles.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # No NODE_AUTH_TOKEN: credentials come from the OIDC exchange, and
      # provenance is attached automatically.
      - run: npm publish
