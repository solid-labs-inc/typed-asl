name: Scorecard

# OpenSSF Scorecard grades this repo's supply-chain posture (pinned
# actions, least-privilege tokens, branch protection, published
# provenance) and publishes the result so the README badge and
# scorecard.dev can read it.

on:
  # Scorecard reads branch-protection settings, so re-grade when they change.
  branch_protection_rule:
  schedule:
    - cron: '31 6 * * 1'
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Uploads the SARIF result to the code-scanning dashboard.
      security-events: write
      # Signs the result so publish_results can attest where it came from.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Required for the badge: publishes to the public dataset that
          # api.securityscorecards.dev and shields.io read from.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: results.sarif
